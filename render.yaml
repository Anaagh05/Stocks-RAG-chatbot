services:
  - type: web
    name: rag-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn api:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: COHERE_API_KEY
        sync: false

  - type: cron
    name: rag-ingestion-cron
    env: python
    schedule: "0 10 * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python src/ingest.py"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: COHERE_API_KEY
        sync: false
